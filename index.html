<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebAR 赛博圣诞树 - 终极版</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }

        /* 视频层：镜像 */
        #input-video {
            position: absolute;
            width: 100vw; height: 100vh;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 0;
            filter: brightness(0.7); /* 稍微压暗背景，突出特效 */
        }

        /* 画布层 */
        #output-canvas {
            position: absolute;
            width: 100vw; height: 100vh;
            z-index: 1;
        }

        /* UI */
        #ui-layer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        .hud-text {
            color: rgba(0, 255, 255, 0.9);
            font-size: 14px;
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 12px;
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            margin: 0 4px;
            display: inline-block;
            backdrop-filter: blur(4px);
        }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: cyan;
            font-size: 24px;
            z-index: 20;
            text-shadow: 0 0 10px cyan;
        }
    </style>
</head>
<body>
    <video id="input-video" playsinline muted></video>
    <canvas id="output-canvas"></canvas>
    
    <div id="loading">✨ 正在装载魔法引擎...</div>

    <div id="ui-layer">
        <div class="hud-text">☝️ 食指：流光魔法</div>
        <div class="hud-text">✌️ V手势：霓虹变色</div>
        <div class="hud-text">🖐️ 张手：星球爆发</div>
        <div class="hud-text">✊ 握拳：重组</div>
    </div>

    <script>
        // --- 核心配置 ---
        const CONFIG = {
            particleCount: 1500,    // 粒子数量
            treeBaseWidth: 280,     // 树底宽度
            treeHeight: 500,        // 树高度
            sparkLife: 0.96,        // 火花消失速度 (越大越慢)
            gravity: 0.25           // 火花重力
        };

        const canvas = document.getElementById('output-canvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');

        let width, height;
        let particles = [];
        let sparks = [];
        let time = 0;
        
        // 状态
        let targetShape = 'tree'; // tree, sphere
        let colorMode = 'normal'; // normal, disco
        let transitionVal = 0;    // 0 = tree, 1 = sphere

        // --- 粒子类 ---
        class Particle {
            constructor(idx) {
                this.idx = idx;
                this.x = 0; this.y = 0; this.z = 0;
                
                // 树形态的目标坐标
                this.treeX = 0; this.treeY = 0; this.treeZ = 0;
                // 球形态的目标坐标
                this.sphereX = 0; this.sphereY = 0; this.sphereZ = 0;

                this.size = Math.random() * 2 + 1;
                this.baseColor = `hsl(${Math.random() * 50 + 100}, 80%, 60%)`; // 默认绿色系
                this.color = this.baseColor;
                
                this.calculateTargets();
                // 初始位置设为树的位置
                this.x = this.treeX; this.y = this.treeY; this.z = this.treeZ;
            }

            calculateTargets() {
                // 1. 完美圆锥螺旋树 (Fermat's Spiral on Cone)
                const ratio = this.idx / CONFIG.particleCount; // 0 (顶) -> 1 (底)
                const angle = this.idx * 2.39996; // 黄金角
                
                const r = ratio * CONFIG.treeBaseWidth; // 半径随高度变大
                const h = ratio * CONFIG.treeHeight - CONFIG.treeHeight / 2; // 高度

                this.treeX = Math.cos(angle) * r;
                this.treeY = h;
                this.treeZ = Math.sin(angle) * r;

                // 2. 球体形态 (Fibonacci Sphere)
                const phi = Math.acos(1 - 2 * ratio);
                const theta = Math.sqrt(CONFIG.particleCount * Math.PI) * phi;
                const sphereR = 250;

                this.sphereX = sphereR * Math.cos(theta) * Math.sin(phi);
                this.sphereY = sphereR * Math.sin(theta) * Math.sin(phi);
                this.sphereZ = sphereR * Math.cos(phi);
            }
        }

        // --- 火花类 (增强版) ---
        class Spark {
            constructor(x, y, vx, vy) {
                this.x = x; this.y = y;
                this.vx = vx; this.vy = vy;
                this.life = 1.0;
                // 颜色从金黄 -> 橙 -> 红 -> 消失
                this.hue = 40 + Math.random() * 20; 
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += CONFIG.gravity; // 重力
                this.vx *= 0.95; // 空气阻力
                this.vy *= 0.95;
                this.life *= CONFIG.sparkLife;
                this.hue -= 0.5; // 颜色变红
            }
            draw(ctx) {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4 * this.life, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // 初始化
        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < CONFIG.particleCount; i++) {
                particles.push(new Particle(i));
            }
            // 顶部加一颗大星星
            const star = new Particle(0);
            star.treeX = 0; star.treeY = -CONFIG.treeHeight/2 - 10; star.treeZ = 0;
            star.size = 12; 
            star.baseColor = '#FFD700';
            particles.push(star);
        }

        // --- 渲染循环 ---
        function animate() {
            // 使用 source-over 且带一点黑色背景，形成非常短的拖尾效果，如果不想要拖尾改为 clearRect
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)'; 
            ctx.clearRect(0, 0, width, height);

            time += 0.015;
            const centerX = width / 2;
            const centerY = height / 2 + 50;

            // 1. 处理火花
            ctx.globalCompositeOperation = 'lighter'; // 叠加高亮模式
            for (let i = sparks.length - 1; i >= 0; i--) {
                const s = sparks[i];
                s.update();
                if (s.life < 0.05) sparks.splice(i, 1);
                else s.draw(ctx);
            }

            // 2. 状态过渡
            const targetVal = (targetShape === 'sphere') ? 1 : 0;
            transitionVal += (targetVal - transitionVal) * 0.05; // 缓动插值

            // 3. 绘制 3D 粒子树
            // 自动旋转
            const rotY = time * 0.6;
            const cosRot = Math.cos(rotY);
            const sinRot = Math.sin(rotY);

            particles.forEach(p => {
                // 形状插值
                const tx = p.treeX + (p.sphereX - p.treeX) * transitionVal;
                const ty = p.treeY + (p.sphereY - p.treeY) * transitionVal;
                const tz = p.treeZ + (p.sphereZ - p.treeZ) * transitionVal;

                // 旋转公式
                const rx = tx * cosRot - tz * sinRot;
                const rz = tx * sinRot + tz * cosRot;
                const ry = ty;

                // 3D 投影
                const perspective = 800 / (800 - rz); // 简单的透视投影
                const x2d = centerX + rx * perspective;
                const y2d = centerY + ry * perspective;
                const size2d = p.size * perspective;

                // 颜色逻辑
                let drawColor = p.baseColor;
                if (colorMode === 'disco') {
                    // 迪斯科模式：基于位置和时间生成彩虹色
                    const hue = (time * 100 + p.idx) % 360;
                    drawColor = `hsl(${hue}, 80%, 60%)`;
                } else if (p.size > 8) {
                     drawColor = '#FFD700'; // 星星永远是金色
                } else if (Math.random() < 0.01) {
                    drawColor = '#FFF'; // 随机闪烁
                }

                if (size2d > 0) {
                    ctx.fillStyle = drawColor;
                    ctx.globalAlpha = 1;
                    
                    // 发光效果
                    if(p.size > 8) { // 星星发光
                         ctx.shadowBlur = 20;
                         ctx.shadowColor = drawColor;
                    } else {
                        ctx.shadowBlur = 0;
                    }

                    ctx.beginPath();
                    ctx.arc(x2d, y2d, size2d, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            ctx.globalCompositeOperation = 'source-over';
            ctx.shadowBlur = 0;
            
            // requestAnimationFrame(animate); // 由 Camera loop 驱动，不需要手动调用
        }

        // --- 手势处理 ---
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.65,
            minTrackingConfidence: 0.65
        });

        // 记录上一帧食指位置计算速度
        let lastIndexX = 0, lastIndexY = 0;

        hands.onResults(results => {
            // 即使没有手也需要绘制背景动画
            animate();

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // 关键点
                const wrist = landmarks[0];
                const indexTip = landmarks[8];
                const middleTip = landmarks[12];
                const ringTip = landmarks[16];
                const pinkyTip = landmarks[20];
                const indexBase = landmarks[5];

                // 坐标映射
                const ix = (1 - indexTip.x) * width;
                const iy = indexTip.y * height;

                // 计算手指速度 (用于喷射力度)
                const speed = Math.hypot(ix - lastIndexX, iy - lastIndexY);
                lastIndexX = ix; lastIndexY = iy;

                // 1. 食指伸出检测 (指尖距离手腕 远大于 指根距离手腕)
                const dTip = Math.hypot(indexTip.x - wrist.x, indexTip.y - wrist.y);
                const dBase = Math.hypot(indexBase.x - wrist.x, indexBase.y - wrist.y);
                const isIndexExtended = dTip > dBase * 1.5;

                // 2. ✌️ 胜利手势检测 (食指+中指伸出，其他弯曲)
                const dMiddle = Math.hypot(middleTip.x - wrist.x, middleTip.y - wrist.y);
                const dRing = Math.hypot(ringTip.x - wrist.x, ringTip.y - wrist.y);
                const isVictory = isIndexExtended && (dMiddle > dBase * 1.3) && (dRing < dBase * 1.2);

                // 3. 🖐️ 张手检测 (五个手指都伸直)
                const isOpenHand = (dTip > 0.4 && dMiddle > 0.4 && dRing > 0.35);

                // --- 触发逻辑 ---

                if (isVictory) {
                    colorMode = 'disco';
                } else {
                    colorMode = 'normal';
                }

                if (isOpenHand) {
                    targetShape = 'sphere';
                } else if (!isOpenHand && !isVictory) { // 握拳或其他
                    targetShape = 'tree';
                }

                // 火花逻辑：只要伸出食指，或者 V手势
                if (isIndexExtended) {
                    const count = Math.min(5, Math.ceil(speed / 2) + 1); // 动得越快，火花越多
                    for(let k=0; k<count; k++) {
                        // 随机向四周喷射
                        const angle = Math.random() * Math.PI * 2;
                        const vel = Math.random() * 5 + 2;
                        sparks.push(new Spark(
                            ix, iy, 
                            Math.cos(angle) * vel + (ix - lastIndexX)*0.2, // 继承一点惯性
                            Math.sin(angle) * vel
                        ));
                    }
                }
            }
        });

        // 启动摄像头
        const video = document.getElementById('input-video');
        const camera = new Camera(video, {
            onFrame: async () => {
                await hands.send({image: video});
            },
            width: 1280,
            height: 720
        });

        camera.start().then(() => {
            loading.style.display = 'none';
            init();
        });

        window.addEventListener('resize', init);
    </script>
</body>
</html>
